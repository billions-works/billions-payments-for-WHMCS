name: Test and release WHMCS module

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - name: Lint and test
        run: |
          find modules tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/ClientTest.php
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package installable module
        run: zip -r billions-payments-for-whmcs.zip modules README.md LICENSE
      - uses: softprops/action-gh-release@v2
        with:
          files: billions-payments-for-whmcs.zip
